metadata:
  id: intencoes
  version: 3.0.0
  priority: high
  description: Classificação da intenção principal para a saída estruturada do atendimento.

intents:

  compra:
    descricao: Cliente demonstra interesse em adquirir um aparelho ou avançar uma negociação de compra.
    exemplos:
      - pergunta disponibilidade ou preço de aparelho
      - procura modelo, cor, memória ou unidade
      - pede recomendação para comprar
      - escolhe um aparelho
      - pede reserva
      - demonstra intenção de fechar

  duvida:
    descricao: Cliente busca informação que não é melhor representada pelas demais categorias.
    exemplos:
      - garantia
      - condição ou funcionamento de aparelho
      - fotos ou vídeos
      - informações gerais
      - pós-venda
      - assistência
      - dúvidas sobre a operação

  comparacao:
    descricao: Cliente compara modelos, aparelhos, preços, características ou custo-benefício.
    exemplos:
      - compara dois modelos
      - pergunta qual vale mais a pena
      - compara duas unidades
      - pergunta sobre vantagem de trocar de modelo

  troca:
    descricao: O foco atual é usar um aparelho usado na negociação ou realizar sua avaliação.
    exemplos:
      - pergunta se aceita aparelho na troca
      - informa dados do aparelho usado
      - pergunta quanto vale seu aparelho
      - negocia avaliação
      - pergunta diferença considerando a troca

  pagamento:
    descricao: O foco atual é forma ou condição de pagamento.
    exemplos:
      - Pix
      - dinheiro
      - débito
      - crédito
      - parcelamento
      - quantidade ou valor de parcelas
      - combinação de formas de pagamento

  entrega:
    descricao: O foco atual é logística para receber ou retirar o aparelho.
    exemplos:
      - entrega
      - retirada
      - bairro ou região
      - taxa de entrega
      - prazo
      - horário
      - local de retirada

  outro:
    descricao: Usar somente quando nenhuma categoria anterior representar adequadamente o foco principal da mensagem.
    exemplos:
      - conversa sem intenção comercial identificável
      - mensagem ambígua sem contexto suficiente
      - assunto fora das categorias disponíveis

classification_rules:

  - Retornar exatamente uma intenção.
  - Usar somente os valores definidos neste arquivo.
  - Classificar pelo foco principal da mensagem atual considerando o contexto da conversa.
  - Quando houver mais de um assunto, escolher aquele que representa o próximo passo principal.
  - Não criar novas categorias de intenção.
  - Não usar o nome do playbook como intenção quando esse nome não estiver entre os valores permitidos.

  - Uma pergunta sobre preço, estoque, cor, memória ou disponibilidade de aparelho normalmente pertence a compra.
  - Pedido de recomendação para escolher um aparelho pertence a compra.
  - Garantia, estado do aparelho, fotos, vídeos, pós-venda e assistência pertencem a duvida quando nenhuma categoria mais específica desta lista representar melhor o foco.
  - Pedido de desconto não cria uma intenção própria; classificar conforme o foco da negociação, normalmente compra ou pagamento.
  - Reserva e fechamento não são intenções próprias; normalmente pertencem a compra.
  - Reclamação e pedido de atendimento humano não são intenções próprias; usar a categoria que melhor representa o assunto e controlar precisa_humano separadamente.

  - Se o cliente estiver comprando um aparelho e perguntar especificamente sobre parcelamento, usar pagamento.
  - Se estiver comprando e o foco passar para entrega ou retirada, usar entrega.
  - Se o foco passar para avaliação do aparelho usado, usar troca.
  - Se estiver comparando alternativas para decidir, usar comparacao.

context_interpretation:

  - '"iPhone 13" significa iPhone 13 normal.'
  - '"linha 13" pode incluir mini, normal, Pro e Pro Max.'
  - Não interpretar versões diferentes quando o cliente informou um modelo exato.
  - Respostas curtas como "preto", "128", "quanto fica?" ou "e na troca?" devem ser interpretadas dentro da conversa anterior.
  - Uma resposta curta do cliente pode mudar o foco da intenção sem representar uma nova conversa.
